name: Cloudflare Pages

# Branch deployments only. Pull request previews (with their own isolated Convex
# preview deployment) are handled by `convex-preview.yml`.
on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Convex + Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ (github.ref == 'refs/heads/main' && 'production') || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deploy the Convex backend BEFORE building the frontend so the site never
      # goes live against an un-migrated backend. For branch deploys the Convex
      # URLs are fixed per environment (read from GitHub vars below), not from
      # this step's output — that only applies to previews.
      - name: Deploy Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm convex deploy

      - name: Build
        env:
          PUBLIC_CONVEX_URL: ${{ vars.PUBLIC_CONVEX_URL }}
          PUBLIC_CONVEX_SITE_URL: ${{ vars.PUBLIC_CONVEX_SITE_URL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://modernstack-saas.com' }}
        run: pnpm run build

      - name: Set Cloudflare Node Version
        run: cp .node-version ./.svelte-kit/cloudflare/.node-version

      - name: Extract Repository Name
        id: extract_repo
        shell: bash
        run: |
          full_repo_name="${{ github.repository }}"
          repo_name="${full_repo_name##*/}"
          echo "Repository name: $repo_name"
          echo "repo_name=$repo_name" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./.svelte-kit/cloudflare --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || steps.extract_repo.outputs.repo_name }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
